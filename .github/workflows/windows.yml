name: Windows
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check subscription integration
        run: node windows/tests/enhancer.test.cjs
      - name: Build x64 and verify kernel signature
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          ./windows/packaging/build.ps1
      - name: Install and exercise the real driver
        shell: pwsh
        run: ./windows/tests/integration.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lianwang-Windows-x64
          path: out/Lianwang-Windows-x64-Setup.exe
          if-no-files-found: error
