plugins { id 'com.android.application' version '8.9.2' }
android {
    namespace 'io.github.maotiannan.lianwang'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.maotiannan.lianwang'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'io.github.maotiannan.lianwang.RoutingChecks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation files('libs/core.aar') }
