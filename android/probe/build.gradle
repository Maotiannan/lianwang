// Test clients have independent Android UIDs and are installed only on the emulator.
plugins { id 'com.android.application' version '8.9.2' }
android {
    namespace 'io.github.maotiannan.probe'
    compileSdk 35
    defaultConfig { applicationId 'io.github.maotiannan.probe'; minSdk 29; targetSdk 35 }
    flavorDimensions 'client'
    productFlavors {
        guard { dimension 'client'; applicationIdSuffix '.guard' }
        target { dimension 'client'; applicationIdSuffix '.target' }
    }
}
